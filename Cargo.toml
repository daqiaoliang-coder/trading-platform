[workspace]
members = [
    "crates/protocol",
    "crates/storage",
    "crates/partition",
    "crates/projection",
    "crates/replication",
    "crates/loadgen",
    "crates/node",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
crc32fast = "1.4"
fs2 = "0.4"
openraft = { version = "0.9.21", features = ["single-term-leader", "storage-v2"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "macros", "io-util"] }
trading-protocol = { path = "crates/protocol" }
trading-storage = { path = "crates/storage" }
trading-partition = { path = "crates/partition" }
trading-projection = { path = "crates/projection" }
trading-replication = { path = "crates/replication" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postgres = "0.19"

[profile.release]
lto = "thin"
codegen-units = 1
